<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карта руйнувань Києва</title>
    
    <!-- Підключення стилів карти -->
    <link rel="stylesheet" href="https://cloudflare.com" />
    
    <style>
        html, body, #map {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #f0f0f0; /* Світле тло за замовчуванням */
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <!-- Підключення інструменту карти -->
    <script src="https://cloudflare.com" onload="startMap()"></script>

    <script>
        function startMap() {
            // Створюємо карту та фокусуємося на Києві
            const map = L.map('map').setView([50.4501, 30.5234], 11);

            // НАДІЙНА БАЗОВА КАРТА OPENSTREETMAP БЕЗ ЖОДНИХ БЛОКУВАНЬ CORS ЧИ СЕРВЕРІВ
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; OpenStreetMap contributors'
            }).addTo(map);
        }
    </script>
</body>
</html>
