<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карта Києва (Оригінальні кольори)</title>
    <style>
        /* Чистий світлий фон сторінки */
        html, body {
            margin: 0;
            padding: 0;
            width: 100% !important;
            height: 100% !important;
            background-color: #f4f4f6; 
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Контейнер карти на весь екран */
        #map-container {
            width: 100vw !important;
            height: 100vh !important;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            box-sizing: border-box;
        }

        /* Робимо сам SVG адаптивним під будь-який екран */
        #map-container svg {
            width: 100% !important;
            height: 100% !important;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain; /* Зберігає ідеальні географічні пропорції */
        }

        /* Тільки ефект наведення мишкою, без зміни твоїх базових кольорів */
        #map-container path:hover, #map-container polygon:hover {
            opacity: 0.8;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="map-container">Завантаження карти...</div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            // Завантажуємо твій оновлений в Inkscape файл border.svg
            fetch('border.svg?v=' + Date.now())
                .then(response => {
                    if (!response.ok) throw new Error('Файл border.svg не знайдено');
                    return response.text();
                })
                .then(svgText => {
                    const container = document.getElementById('map-container');
                    container.innerHTML = svgText;
                    
                    const svgElement = container.querySelector('svg');
                    if (svgElement) {
                        // Робимо загальний контейнер самого SVG прозорим, щоб бачити фон сторінки
                        svgElement.style.backgroundColor = 'transparent';

                        // Дозволяємо SVG адаптивно розтягуватися
                        svgElement.setAttribute('width', '100%');
                        svgElement.setAttribute('height', '100%');
                        
                        // Фіксуємо viewBox з QGIS
                        if (!svgElement.getAttribute('viewBox')) {
                            svgElement.setAttribute('viewBox', '0 0 162.775 145.419');
                        }
                    }
                })
                .catch(error => {
                    document.getElementById('map-container').innerHTML = 
                        `<p style="color: #ff3333; font-size: 16px;">Помилка відображення файлу border.svg</p>`;
                    console.error(error);
                });
        });
    </script>
</body>
</html>
