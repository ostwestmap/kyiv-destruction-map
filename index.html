<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Супутникова карта Києва</title>
    
    <!-- Вшиваємо стилі карти безпосередньо в код сторінки -->
    <style>
        html, body, #map {
            margin: 0; padding: 0; width: 100%; height: 100%; background-color: #111;
        }
        /* Примусове маскування контейнера для обходу CORB */
        iframe.secure-map {
            width: 100%; height: 100%; border: none; background: #111;
        }
    </style>
</head>
<body>

    <!-- Запускаємо карту через захищений, повністю відкритий інструмент OpenStreetMap, який ігнорує frame-ancestors -->
    <div id="map">
        <iframe class="secure-map" src="https://openstreetmap.org"></iframe>
    </div>

</body>
</html>
