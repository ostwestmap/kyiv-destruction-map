<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Карта</title>
    <!-- Підключаємо базові стилі карти -->
    <link rel="stylesheet" href="https://cloudflare.com" />
    <style>
        /* Робимо карту на весь екран */
        html, body, #map {
            margin: 0; padding: 0; width: 100%; height: 100%; background: #111;
        }
    </style>
</head>
<body>

    <!-- Елемент, де малюється карта -->
    <div id="map"></div>

    <!-- Підключаємо сам інструмент карти -->
    <script src="https://cloudflare.com"></script>

    <script>
        // 1. Створюємо карту і показуємо Київ
        const map = L.map('map').setView([50.4501, 30.5234], 11);

        // 2. Додаємо темне тло карти (вулиці та будинки)
        L.tileLayer('https://{s}://{z}/{x}/{y}{r}.png').addTo(map);

        // 3. Беремо ваш чистий файл і просто малюємо звичайні червоні точки
        fetch('kyiv_damage.geojson')
            .then(res => res.json())
            .then(data => {
                L.geoJSON(data, {
                    pointToLayer: function (feature, latlng) {
                        return L.circleMarker(latlng, {
                            radius: 6,
                            fillColor: "#ff3333",
                            color: "#fff",
                            weight: 1,
                            fillOpacity: 0.8
                        });
                    }
                }).addTo(map);
            });
    </script>
</body>
</html>
