<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Базова супутникова карта Києва</title>
    
    <!-- Підключаємо базові стилі карти -->
    <link rel="stylesheet" href="https://cloudflare.com" />
    
    <style>
        /* Розгортаємо карту на весь екран */
        html, body, #map {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #111;
        }
    </style>
</head>
<body>

    <!-- Контейнер для карти -->
    <div id="map"></div>

    <!-- Підключення інструменту карти -->
    <script src="https://cloudflare.com" onload="startMap()"></script>

    <script>
        function startMap() {
            // 1. Створюємо карту та фокусуємося строго на Києві
            const map = L.map('map').setView([50.4501, 30.5234], 11);

            // 2. ЧИСТИЙ СУПУТНИКОВИЙ ШАР ESRI (Строго за твоїм робочим посиланням)
            L.tileLayer('https://server.arcgisonline.com/arcgis/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
                maxZoom: 19,
                subdomains: [], // Прибираємо субдомени, щоб Leaflet не ламав адресу
                attribution: 'Tiles &copy; Esri'
            }).addTo(map);
        }
    </script>
</body>
</html>
