<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карта руйнувань Києва</title>
    <style>
        /* Жорстке розгортання на весь екран без прокруток */
        html, body {
            margin: 0;
            padding: 0;
            width: 100% !important;
            height: 100% !important;
            background-color: #f4f4f6; /* Чистий світлий фон */
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        /* Контейнер карти, який займає 100% доступного простору */
        #map-container {
            width: 100vw !important;
            height: 100vh !important;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            padding: 10px; /* Мінімальний безпечний відступ від країв екрану */
        }

        /* Робимо сам SVG адаптивним і примусово розтягуємо до максимумів вікна */
        #map-container svg {
            width: 100% !important;
            height: 100% !important;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain; /* Зберігає правильні пропорції Києва на будь-якому екрані */
        }

        /* Налаштування ліній та кольору контуру міста */
        #map-container path {
            fill: #ffffff !important;         /* Біла заливка міста */
            stroke: #555555 !important;       /* Чіткі темні лінії меж */
            stroke-width: 0.4px !important;   /* Оптимальна товщина ліній */
            transition: fill 0.2s, stroke 0.2s;
            cursor: pointer;
        }

        /* Ефект підсвічування району при наведенні мишкою */
        #map-container path:hover {
            fill: #e9ecef !important;
            stroke: #ff3333 !important;       /* Робимо межу червоною при наведенні */
            stroke-width: 0.8px !important;
        }
    </style>
</head>
<body>

    <!-- Єдиний повноекранний контейнер для нашого SVG -->
    <div id="map-container">Завантаження карти...</div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            // Завантажуємо обраний файл border.svg із захистом від кешу
            fetch('border.svg?v=' + Date.now())
                .then(response => {
                    if (!response.ok) throw new Error('Файл border.svg не знайдено');
                    return response.text();
                })
                .then(svgText => {
                    const container = document.getElementById('map-container');
                    container.innerHTML = svgText;
                    
                    const svgElement = container.querySelector('svg');
                    if (svgElement) {
                        // Скидаємо фіксовані пікселі QGIS, щоб увімкнути повну адаптивність
                        svgElement.setAttribute('width', '100%');
                        svgElement.setAttribute('height', '100%');
                        
                        // Фіксуємо правильну сітку координат з QGIS макета
                        if (!svgElement.getAttribute('viewBox')) {
                            svgElement.setAttribute('viewBox', '0 0 162.775 145.419');
                        }
                    }
                })
                .catch(error => {
                    document.getElementById('map-container').innerHTML = 
                        `<p style="color: #ff3333; font-size: 16px; font-weight: bold;">
                            Помилка завантаження файлу контурів міста.
                         </p>`;
                    console.error(error);
                });
        });
    </script>
</body>
</html>
