<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карта руйнувань Києва</title>
    <style>
        /* Стильне темне тло, як на карті-прикладі */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }

        /* Контейнер для нашої карти */
        .map-wrapper {
            width: 90vw;
            height: 85vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Стилізація самого SVG-контуру міста */
        .map-wrapper svg {
            width: 100%;
            height: 100%;
            max-width: 800px;
            max-height: 700px;
        }

        /* Фарбуємо лінії та заливку Києва, додаємо красиве підсвічування при наведенні */
        .map-wrapper path {
            fill: #2a2a2a !important;
            stroke: #444444 !important;
            stroke-width: 0.5px !important;
            transition: fill 0.3s, stroke 0.3s;
            cursor: pointer;
        }

        .map-wrapper path:hover {
            fill: #3a3a3a !important;
            stroke: #ff3333 !important; /* Підсвічуємо червоним межі при наведенні */
        }

        /* Заголовок карти */
        .map-header {
            position: absolute;
            top: 20px;
            color: #ffffff;
            text-align: center;
            pointer-events: none;
        }
        .map-header h1 {
            margin: 0;
            font-size: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <div class="map-header">
        <h1>Межі Києва (Автономна карта)</h1>
    </div>

    <!-- Сюди за допомогою JavaScript завантажиться твій файл border.svg -->
    <div class="map-wrapper" id="map-container"></div>

    <script>
        // Завантажуємо твій файл border.svg напряму з репозиторію
        fetch('border.svg')
            .then(response => {
                if (!response.ok) throw new Error('Не вдалося завантажити файл меж');
                return response.text();
            })
            .then(svgText => {
                const container = document.getElementById('map-container');
                // Вбудовуємо SVG код прямо в сторінку
                container.innerHTML = svgText;
                
                // Налаштовуємо параметри відображення, щоб малюнок масштабувався адаптивно
                const svgElement = container.querySelector('svg');
                if (svgElement) {
                    svgElement.setAttribute('width', '100%');
                    svgElement.setAttribute('height', '100%');
                    // Додатковий захист: якщо QGIS не прописав viewBox, фіксуємо його з твого скриншоту
                    if (!svgElement.getAttribute('viewBox')) {
                        svgElement.setAttribute('viewBox', '0 0 162.775 145.419');
                    }
                }
            })
            .catch(error => {
                console.error('Помилка завантаження карти:', error);
                document.getElementById('map-container').innerHTML = 
                    `<p style="color: #ff4d4d;">Помилка завантаження файлу border.svg. Перевірте консоль.</p>`;
            });
    </script>
</body>
</html>
