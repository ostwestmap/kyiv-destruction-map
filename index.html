<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карта руйнувань Києва</title>
    
    <!-- Підключаємо стилі Leaflet -->
    <link rel="stylesheet" href="https://cloudflare.com" />
    
    <style>
        /* Нормальна карта на весь екран */
        html, body, #map {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #f0f0f0;
        }
        
        /* Гарний дизайн віконець при кліку */
        .leaflet-popup-content-wrapper {
            background: #222 !important;
            color: #fff !important;
            border-radius: 8px;
        }
        .leaflet-popup-content h3 {
            margin: 0 0 8px 0;
            color: #ff4d4d;
            border-bottom: 1px solid #444;
            padding-bottom: 5px;
        }
        .map-title {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(20, 20, 20, 0.9);
            padding: 8px 20px;
            border-radius: 20px;
            color: #fff;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="map-title">
        <h2>Карта руйнувань Києва</h2>
    </div>

    <!-- Головний контейнер справжньої карти -->
    <div id="map"></div>

    <!-- Завантажуємо Leaflet JS -->
    <script src="https://cloudflare.com" onload="initRealMap()"></script>

    <script>
        function initRealMap() {
            // 1. Створюємо нормальну карту з центром у Києві
            const map = L.map('map').setView([50.4501, 30.5234], 11);

            // 2. СВІТЛИЙ ПРОФЕСІЙНИЙ TMS ШАР ESRI (Топографічна карта світу)
            // Цей сервер працює залізобетонно і не блокується
            L.tileLayer('https://server.arcgisonline.com/arcgis/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
                maxZoom: 19,
                attribution: 'Tiles &copy; Esri &mdash; Esri, DeLorme, NAVTEQ, TomTom, Intermap, iPC, USGS, FAO, NPS, NRCAN, GeoBase, Kadaster NL, Ordnance Survey, Esri Japan, METI, Esri China (Hong Kong), and the GIS User Community'
            }).addTo(map);

            // 3. Завантажуємо твій чистий GeoJSON файл із QGIS
            fetch('kyiv_damage.geojson')
                .then(res => {
                    if (!res.ok) throw new Error("Не вдалося завантажити геодані");
                    return res.json();
                })
                .then(data => {
                    // Наносимо реальні GPS точки на реальну карту
                    L.geoJSON(data, {
                        pointToLayer: function (feature, latlng) {
                            return L.circleMarker(latlng, {
                                radius: 6,
                                fillColor: "#ff3333", // Червоні маркери
                                color: "#ffffff",     // Білий контур
                                weight: 1,
                                fillOpacity: 0.8
                            });
                        },
                        onEachFeature: function (feature, layer) {
                            const props = feature.properties || {};
                            let popupContent = `<h3>Подія №${props.num || '?'}</h3>`;
                            if (props.date_time) popupContent += `<p><b>🕒 Дата:</b> ${props.date_time}</p>`;
                            if (props.place) popupContent += `<p><b>📍 Місце:</b> ${props.place}</p>`;
                            if (props.wapen && props.wapen !== '—') popupContent += `<p><b>🚀 Зброя:</b> ${props.wapen}</p>`;
                            if (props.damage) popupContent += `<p style="border-top:1px solid #444; padding-top:5px; color:#ddd;">${props.damage}</p>`;
                            
                            layer.bindPopup(popupContent, { maxWidth: 280 });
                        }
                    }).addTo(map);
                })
                .catch(err => console.error("Помилка завантаження точок:", err));
        }
    </script>
</body>
</html>
