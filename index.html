<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Базова карта Києва</title>
    
    <!-- Підключаємо базові стилі карти -->
    <link rel="stylesheet" href="https://cloudflare.com" />
    
    <style>
        /* Розгортаємо карту строго на весь екран */
        html, body, #map {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #f0f0f0;
        }
    </style>
</head>
<body>

    <!-- Елемент карти -->
    <div id="map"></div>

    <!-- Підключення інструменту карти -->
    <script src="https://cloudflare.com" onload="startMap()"></script>

    <script>
        function startMap() {
            // 1. Створюємо карту та фокусуємося на Києві
            const map = L.map('map').setView([50.4501, 30.5234], 11);

            // 2. ПРЯМИЙ TMS-ШАР OPENSTREETMAP (Працює як звичайні картинки)
            L.tileLayer('https://openstreetmap.org{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; OpenStreetMap contributors'
            }).addTo(map);
        }
    </script>
</body>
</html>
