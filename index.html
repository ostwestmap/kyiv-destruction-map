<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карта руйнувань Києва</title>
    
    <!-- Підключаємо стилі з unpkg (як у робочих картах) -->
    <link rel="stylesheet" href="https://unpkg.com" />
    
    <style>
        html, body, #map {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #f5f5f5;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <!-- Підключаємо JS з unpkg, який не блокується твоїм провайдером -->
    <script src="https://unpkg.com"></script>

    <script>
        // Чекаємо, поки скрипт повністю прочитається браузером
        window.addEventListener('load', function() {
            if (typeof L === 'undefined') {
                alert("Помилка: бібліотека карти заблокована мережею. Спробуйте увімкнути VPN.");
                return;
            }

            // 1. Ініціалізація карти (Київ)
            const map = L.map('map').setView([50.4501, 30.5234], 11);

            // 2. Базовий шар OpenStreetMap
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; OpenStreetMap contributors'
            }).addTo(map);

            // 3. Завантаження точок
            fetch('kyiv_damage.geojson')
                .then(res => res.json())
                .then(data => {
                    L.geoJSON(data, {
                        pointToLayer: function (feature, latlng) {
                            return L.circleMarker(latlng, {
                                radius: 6,
                                fillColor: "#ff3333",
                                color: "#ffffff",
                                weight: 1,
                                fillOpacity: 0.8
                            });
                        },
                        onEachFeature: function (feature, layer) {
                            const props = feature.properties || {};
                            let popupContent = `<h3>Подія №${props.num || '?'}</h3>`;
                            if (props.date_time) popupContent += `<p><b>🕒 Дата:</b> ${props.date_time}</p>`;
                            if (props.place) popupContent += `<p><b>📍 Місце:</b> ${props.place}</p>`;
                            if (props.wapen && props.wapen !== '—') popupContent += `<p><b>🚀 Зброя:</b> ${props.wapen}</p>`;
                            if (props.damage) popupContent += `<p style="border-top:1px solid #ccc; padding-top:5px; margin-top:5px; color:#555;">${props.damage}</p>`;
                            
                            layer.bindPopup(popupContent, { maxWidth: 280 });
                        }
                    }).addTo(map);
                })
                .catch(err => console.error("Помилка файлу даних:", err));
        });
    </script>
</body>
</html>
