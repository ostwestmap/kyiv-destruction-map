<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карта руйнувань Києва</title>
    <style>
        /* Приємний світлий фон для всієї сторінки */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #f4f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }

        /* Контейнер для адаптивного масштабування */
        .map-wrapper {
            width: 90vw;
            height: 85vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .map-wrapper svg {
            width: 100%;
            height: 100%;
            max-width: 800px;
            max-height: 700px;
        }

        /* Фарбуємо межі Києва у світлий (майже білий) колір, а лінії робимо чіткими сірими */
        .map-wrapper path {
            fill: #ffffff !important;
            stroke: #a0a0a0 !important;
            stroke-width: 0.4px !important;
            transition: fill 0.2s, stroke 0.2s;
            cursor: pointer;
        }

        /* Ефект при наведенні: фарбуємо район у легкий блакитний/сірий, а контур робимо червоним */
        .map-wrapper path:hover {
            fill: #e8ecef !important;
            stroke: #ff3333 !important;
            stroke-width: 0.8px !important;
        }

        /* Заголовок карти (темний текст для світлого фону) */
        .map-header {
            position: absolute;
            top: 20px;
            color: #222222;
            text-align: center;
            pointer-events: none;
        }
        .map-header h1 {
            margin: 0;
            font-size: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 700;
        }
    </style>
</head>
<body>

    <div class="map-header">
        <h1>Карта руйнувань Києва</h1>
    </div>

    <div class="map-wrapper" id="map-container"></div>

    <script>
        // Завантаження файлу SVG
        fetch('border.svg')
            .then(response => {
                if (!response.ok) throw new Error('Не вдалося завантажити файл меж');
                return response.text();
            })
            .then(svgText => {
                const container = document.getElementById('map-container');
                container.innerHTML = svgText;
                
                const svgElement = container.querySelector('svg');
                if (svgElement) {
                    svgElement.setAttribute('width', '100%');
                    svgElement.setAttribute('height', '100%');
                    if (!svgElement.getAttribute('viewBox')) {
                        svgElement.setAttribute('viewBox', '0 0 162.775 145.419');
                    }
                }
            })
            .catch(error => {
                console.error('Помилка:', error);
                document.getElementById('map-container').innerHTML = 
                    `<p style="color: #ff3333;">Помилка відображення контурів.</p>`;
            });
    </script>
</body>
</html>
