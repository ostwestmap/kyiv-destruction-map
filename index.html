<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карта руйнувань Києва</title>
    
    <!-- Підключаємо стилі Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com" />
    
    <style>
        html, body, #map {
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            background-color: #f0f0f0;
        }
        .map-title {
            position: absolute; 
            top: 15px; 
            left: 50%; 
            transform: translateX(-50%); 
            z-index: 1000;
            background: rgba(20, 20, 20, 0.9); 
            padding: 8px 20px; 
            border-radius: 20px; 
            color: #fff; 
            pointer-events: none;
            font-family: Arial, sans-serif;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .map-title h2 {
            margin: 0;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="map-title">
        <h2>Карта руйнувань Києва</h2>
    </div>

    <!-- Головний контейнер карти -->
    <div id="map"></div>

    <!-- ПІДКЛЮЧАЄМО JS ДВИГУН КАРТИ (Строго без зайвих символів на початку) -->
    <script src="https://unpkg.com"></script>

    <script>
        window.onload = function() {
            if (typeof L === 'undefined') {
                console.error("Помилка: Leaflet не завантажився.");
                return;
            }

            // Ініціалізація карти Києва
            const map = L.map('map').setView([50.4501, 30.5234], 11);

            // Використовуємо пряме дзеркало OpenStreetMap
            L.tileLayer('https://openstreetmap.org{z}/{x}/{y}.png', {
                maxZoom: 19,
                crossOrigin: null, // Допомагає обходити суворі SSL-блокування
                attribution: '&copy; OpenStreetMap'
            }).addTo(map);

            // Завантажуємо точки руйнувань із захистом від кешування
            fetch('kyiv_damage.geojson?v=' + Date.now())
                .then(res => {
                    if (!res.ok) throw new Error("Файл геоданих не знайдено");
                    return res.json();
                })
                .then(data => {
                    L.geoJSON(data, {
                        pointToLayer: function (feature, latlng) {
                            return L.circleMarker(latlng, {
                                radius: 6, 
                                fillColor: "#ff3333", 
                                color: "#ffffff", 
                                weight: 1, 
                                fillOpacity: 0.8
                            });
                        }
                    }).addTo(map);
                })
                .catch(err => console.log("Очікування завантаження точок..."));
        };
    </script>
</body>
</html>
