<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Супутникова карта</title>
    
    <!-- Підключаємо стилі через альтернативний Cloudflare CDN, який часто пробиває CORB -->
    <link href="https://cloudflare.com" rel="stylesheet" />
    
    <style>
        html, body, #map {
            margin: 0; padding: 0; width: 100%; height: 100%; background-color: #111;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <!-- Завантажуємо сам рушій карти з надійного cdnjs, оминаючи блокування офіційного ://mapbox.com -->
    <script src="https://cloudflare.com"></script>

    <script>
        // Чекаємо, поки скрипт точно прочитається браузером
        window.onload = function() {
            if (typeof mapboxgl === 'undefined') {
                console.error("Mapbox не зміг завантажитися через блокування CORB.");
                return;
            }

            // Наш робочий токен
            mapboxgl.accessToken = 'pk.eyJ1Ijoib3N0d2VzdG1hcCIsImEiOiJjbTdtOHUxdmowMWN4MnFzOHQ0dW8xeXkxIn0.B5lS52tT_8z5wT9z3z3z3z';

            // Ініціалізація карти
            const map = new mapboxgl.Map({
                container: 'map',
                style: 'mapbox://styles/mapbox/satellite-v9', // Чистий супутник
                center: [30.5234, 50.4501], // Київ
                zoom: 11
            });

            map.addControl(new mapboxgl.NavigationControl(), 'top-right');
        };
    </script>
</body>
</html>
