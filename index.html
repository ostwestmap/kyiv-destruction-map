<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карта руйнувань Києва</title>
    
    <!-- Підключення Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com" />
    
    <style>
        html, body, #map {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #111;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        
        /* Спливаючі вікна (Popup) */
        .leaflet-popup-content-wrapper {
            background: #222;
            color: #fff;
            border-radius: 8px;
            border: 1px solid #444;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .leaflet-popup-content h3 {
            margin: 0 0 8px 0;
            font-size: 16px;
            color: #ff4d4d;
            border-bottom: 1px solid #444;
            padding-bottom: 5px;
        }
        .leaflet-popup-content p {
            margin: 5px 0;
            font-size: 13px;
            line-height: 1.4;
        }
        
        /* Заголовок карти */
        .map-title {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(20, 20, 20, 0.9);
            padding: 10px 25px;
            border-radius: 30px;
            border: 1px solid #444;
            color: #fff;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            pointer-events: none;
        }
        .map-title h1 {
            margin: 0;
            font-size: 18px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Загальний стиль для блоків керування карти */
        .map-control-panel {
            background: rgba(30, 30, 30, 0.95);
            border: 1px solid #444;
            padding: 12px 15px;
            color: #fff;
            border-radius: 8px;
            font-size: 13px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        /* Панель фільтра років */
        .filter-year-btn {
            display: block;
            margin: 6px 0;
            cursor: pointer;
            font-size: 13px;
        }
        .filter-year-btn input {
            margin-right: 8px;
            accent-color: #ff3333;
        }
    </style>
</head>
<body>

    <div class="map-title">
        <h1>Карта руйнувань Києва</h1>
    </div>

    <div id="map"></div>

    <!-- Завантажуємо скрипт Leaflet і ТІЛЬКИ ПІСЛЯ ЦЬОГО запускаємо функцію initMap -->
    <script src="https://unpkg.com" onload="initMap()"></script>

    <script>
        // Ця функція запуститься автоматично, коли файл leaflet.js повністю завантажиться
        function initMap() {
            
            // Ініціалізація карти (Київ)
            const map = L.map('map').setView([50.4501, 30.5234], 11);

            // Темна тема карти
            L.tileLayer('https://{s}://{z}/{x}/{y}{r}.png', {
                attribution: '&copy; OpenStreetMap &copy; CARTO',
                subdomains: 'abcd',
                maxZoom: 20
            }).addTo(map);

            let geojsonLayer;
            let allFeatures = [];
            let activeYears = { "2022": true, "2023": true, "2024": true, "2025": true, "2026": true };

            // Функція для визначення року з тексту дати
            function getYearFromDate(dateStr) {
                if (!dateStr) return null;
                const match = dateStr.match(/\b(202\d)\b/);
                return match ? match[0] : null;
            }

            // Оновлення точок на карті
            function updateMapFilters() {
                if (geojsonLayer) {
                    map.removeLayer(geojsonLayer);
                }

                const filteredFeatures = allFeatures.filter(feature => {
                    if (!feature || !feature.properties) return false;
                    const year = getYearFromDate(feature.properties.date_time);
                    return year ? activeYears[year] : true;
                });

                geojsonLayer = L.geoJSON({
                    type: "FeatureCollection",
                    features: filteredFeatures
                }, {
                    pointToLayer: function (feature, latlng) {
                        return L.circleMarker(latlng, {
                            radius: 6,
                            fillColor: "#ff3333", 
                            color: "#fff",
                            weight: 1,
                            opacity: 0.9,
                            fillOpacity: 0.6
                        });
                    },
                    onEachFeature: function (feature, layer) {
                        const props = feature.properties || {};
                        let popupContent = `<h3>Подія №${props.num || '?'}</h3>`;
                        if (props.date_time) popupContent += `<p><b>🕒 Дата:</b> ${props.date_time}</p>`;
                        if (props.place) popupContent += `<p><b>📍 Місце:</b> ${props.place}</p>`;
                        if (props.wapen && props.wapen !== '—') popupContent += `<p><b>🚀 Зброя:</b> ${props.wapen}</p>`;
                        
                        let casualties = [];
                        if (props.die && props.die !== '—') casualties.push(`Загиблі: ${props.die}`);
                        if (props.injure && props.injure !== '—' && props.injure !== null) casualties.push(`Поранені: ${props.injure}`);
                        if (casualties.length > 0) popupContent += `<p><b>🔴 Постраждалі:</b> ${casualties.join(', ')}</p>`;
                        
                        if (props.damage) popupContent += `<p style="border-top: 1px solid #444; padding-top: 5px; margin-top: 5px; color: #ccc;"><b>Руйнування:</b> ${props.damage}</p>`;

                        layer.bindPopup(popupContent, { maxWidth: 300 });
                    }
                }).addTo(map);
            }

            // Завантаження файлу даних GeoJSON
            fetch('kyiv_damage.geojson')
                .then(response => {
                    if (!response.ok) throw new Error('Помилка завантаження файлу даних');
                    return response.json();
                })
                .then(data => {
                    allFeatures = data.features || [];
                    updateMapFilters();
                })
                .catch(error => console.error('Помилка завантаження точок:', error));

            // Панель фільтрації років
            const filterControl = L.control({position: 'topright'});
            filterControl.onAdd = function () {
                const div = L.DomUtil.create('div', 'map-control-panel');
                div.innerHTML = '<b>Фільтр за роками:</b><br>';
                
                const years = ["2022", "2023", "2024", "2025", "2026"];
                years.forEach(year => {
                    div.innerHTML += `
                        <label class="filter-year-btn">
                            <input type="checkbox" id="chk-${year}" checked>
                            ${year} рік
                        </label>
                    `;
                });
                return div;
            };
            filterControl.addTo(map);

            // Додаємо події зміни стану чекбоксів
            const years = ["2022", "2023", "2024", "2025", "2026"];
            years.forEach(year => {
                document.getElementById(`chk-${year}`).addEventListener('change', function() {
                    activeYears[year] = this.checked;
                    updateMapFilters();
                });
            });

            // Блок легенди
            const legend = L.control({position: 'bottomright'});
            legend.onAdd = function () {
                const div = L.DomUtil.create('div', 'map-control-panel');
                div.innerHTML = '<b>Умовні позначення:</b><br><span style="color:#ff3333; font-size:16px;">●</span> Місце влучання / уламки';
                return div;
            };
            legend.addTo(map);
        }
    </script>
</body>
</html>
